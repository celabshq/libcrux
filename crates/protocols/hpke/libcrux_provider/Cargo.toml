[package]
name = "hpke-rs-libcrux"
version = "0.7.0"
authors = ["Franziskus Kiefer <franziskuskiefer@gmail.com>"]
edition = "2021"
license = "MPL-2.0"
documentation = "https://docs.rs/hpke-rs-libcrux"
description = "Crypto backend for HPKE using formally verified code from libcrux."
readme = "Readme.md"
repository = "https://github.com/celabshq/libcrux"

[dependencies]
hpke-rs-crypto.workspace = true
libcrux-ecdh.workspace = true
libcrux-hkdf.workspace = true
libcrux-kem.workspace = true
libcrux-aead.workspace = true
libcrux-sha3.workspace = true
libcrux-traits.workspace = true
# RustCrypto curves not available in libcrux
# TODO: These should be replaced with libcrux implementations as soon as they
# are available.
p384 = { version = "0.14.0", features = [
    "arithmetic",
    "ecdh",
], default-features = false, optional = true }
p521 = { version = "0.14.0", features = [
    "arithmetic",
    "ecdh",
], default-features = false, optional = true }
# Randomness
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rand_core = { version = "0.10" }
rand_chacha = { version = "0.10", default-features = false }
zeroize = "1.8.2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

# `--all-features` does not build: `draft-connolly-cfrg-hpke-mlkem` and
# `draft-ietf-hpke-pq` are mutually exclusive. Pin a working set for docs.rs.
[package.metadata.docs.rs]
no-default-features = true
features = ["std", "draft-ietf-hpke-pq"]

[features]
deterministic-prng = [] # ⚠️ FOR TESTING ONLY.
rustcrypto-p-curves = ["dep:p384", "dep:p521"]
# DEPRECATED: superseded by `draft-ietf-hpke-pq`. Cannot be enabled together
# with it. Emits a build warning when used.
draft-connolly-cfrg-hpke-mlkem = []
# Post-quantum HPKE ciphersuites (SHAKE256 KDF, pure ML-KEM and the
# ML-KEM/ECDH hybrid KEMs) as used by the MLS PQ ciphersuites.
# For MLKEM1024-P384, "rustcrypto-p-curves" must be enabled as well for now.
# <https://datatracker.ietf.org/doc/html/draft-ietf-hpke-pq>
draft-ietf-hpke-pq = []
std = [
    "rand/std",
    "rand_chacha/std",
    "libcrux-ecdh/std",
    "libcrux-kem/std",
    "hpke-rs-crypto/std",
]

[[bench]]
name = "bench_hkdf"
harness = false

[[bench]]
name = "bench_p256"
harness = false

[[bench]]
name = "bench_x25519"
harness = false
