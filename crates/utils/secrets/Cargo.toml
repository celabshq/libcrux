[package]
name = "libcrux-secrets"
description = "Libcrux utilities for working with secrets"
version = "0.0.6"
readme = "README.md"

authors.workspace = true
license.workspace = true
homepage.workspace = true
edition.workspace = true
repository.workspace = true
exclude = ["/proofs"]

[dependencies]
hax-lib.workspace = true
zeroize = { version = "1.8", default-features = false, optional = true }

[target.'cfg(valgrind_ct_test)'.dependencies]
crabgrind.workspace = true

[features]
check-secret-independence = []
# Implement zeroize::Zeroize for Secret<T>
zeroize = ["dep:zeroize"]

[dev-dependencies]
criterion = "0.8.0"
rand = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(eurydice)',
    'cfg(doc_cfg)',
    'cfg(valgrind_ct_test)'
] }
