[package]
name = "libcrux-secrets"
description = "Libcrux utilities for working with secrets"
version = "0.0.7"
readme = "README.md"

authors.workspace = true
license.workspace = true
homepage.workspace = true
edition.workspace = true
repository.workspace = true
exclude = ["/proofs"]

[dependencies]
# Temporary backend for `Zeroize`, to be replaced by a libcrux implementation.
zeroize = { version = "1.9", default-features = false }

[target.'cfg(valgrind_ct_test)'.dependencies]
crabgrind.workspace = true

[target.'cfg(hax)'.dependencies]
hax-lib.workspace = true

[features]
check-secret-independence = []
# Turns all zeroization into a no-op. Do not use for FIPS 140-3 builds.
disable-zeroization = []

[dev-dependencies]
criterion = "0.8.0"
rand = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(eurydice)',
    'cfg(doc_cfg)',
    'cfg(valgrind_ct_test)'
] }
