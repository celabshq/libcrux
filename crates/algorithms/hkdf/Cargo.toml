[package]
name = "libcrux-hkdf"
version = "0.0.8"
description = "Libcrux HKDF implementation"
readme = "Readme.md"

authors.workspace = true
license.workspace = true
homepage.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
path = "src/hkdf.rs"

[features]
check-secret-independence = ["libcrux-secrets/check-secret-independence"]

[dependencies]
libcrux-hmac = { workspace = true, features = [
    "expose-hacl",
] }
libcrux-hacl-rs = { workspace = true, features = ["alloc"] }
libcrux-secrets.workspace = true

[dev-dependencies]
libcrux-kats = { path = "../../testing/kats", features = ["hkdf"] }
hkdf = "0.13"
sha3 = "0.11"
