[package]
name = "libcrux-rsa"
description = "Formally verified RSA signature library"
version = "0.0.9"
readme = "Readme.md"

authors.workspace = true
license.workspace = true
homepage.workspace = true
edition.workspace = true
repository.workspace = true

[features]
expose-hacl = []

[dependencies]
libcrux-hacl-rs = { workspace = true, features = ["alloc"] }
libcrux-traits.workspace = true
libcrux-macros.workspace = true
libcrux-sha2 = { workspace = true, features = ["expose-hacl"] }
libcrux-secrets.workspace = true

[dev-dependencies]
wycheproof = "0.7.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(valgrind_ct_test)'] }
