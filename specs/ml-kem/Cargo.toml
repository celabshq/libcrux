[package]
name = "hacspec_ml_kem"
version = "0.1.0"
edition = "2021"

[dependencies]
hacspec_sha3 = { path = "../sha3" }
hax-lib.workspace = true

[dev-dependencies]
hacspec_sha3 = { path = "../sha3" }
hex = { version = "0.4.3", features = ["serde"] }
proptest = "1.2.0"
rand = "0.9"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.102"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(hax_backend_lean)',
    'cfg(hax_compilation)',
    'cfg(hax_backend_fstar)',
] }
