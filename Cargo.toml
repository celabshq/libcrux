[package]
name = "libcrux"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/libcrux/"
description = "The Formally Verified Cryptography Library"
exclude = [
    "combined_extraction",
    "c.sh",
    "/.devcontainer",
    "/.docker",
    "flake.lock",
    "flake.nix",
    "formal_verification",
    "fstar-helpers",
    "/.github",
    ".gitignore",
    "no-std-build.sh",
    "/tests",
    "/specs",
    "/proofs",
    "/*.py",
    "/wasm-demo",
    "/fuzz",
    "/git-hooks",
    "/architecture",
    "/libcrux.fst.config.json",
]

[workspace]
members = [
    "benchmarks",
    "crates/algorithms/aes",
    "crates/algorithms/blake2",
    "crates/algorithms/aes/fuzz",
    "crates/algorithms/chacha20poly1305",
    "crates/algorithms/curve25519",
    "crates/algorithms/ecdsa",
    "crates/algorithms/ecdsa/fuzz",
    "crates/algorithms/ed25519",
    "crates/algorithms/hkdf",
    "crates/algorithms/hmac",
    "crates/algorithms/hmac-drbg",
    "crates/algorithms/hmac-drbg/fuzz",
    "crates/algorithms/kmac",
    "crates/algorithms/p256",
    "crates/algorithms/poly1305",
    "crates/algorithms/rsa",
    "crates/algorithms/sha2",
    "crates/algorithms/sha3",
    "crates/primitives/aead",
    "crates/primitives/digest",
    "crates/protocols/hpke",
    "crates/protocols/hpke/libcrux_provider",
    "crates/protocols/hpke/rust_crypto_provider",
    "crates/protocols/hpke/traits",
    "crates/protocols/hpke/wasm",
    "crates/sys/platform",
    "crates/testing/kats",
    "crates/utils/core-models",
    "crates/utils/ctgrind-test",
    "crates/utils/hacl-rs",
    "crates/utils/xtask",
    "crates/utils/intrinsics",
    "crates/utils/macros",
    "crates/utils/secrets",
    "crates/utils/test-utils",
    "libcrux-ecdh",
    "libcrux-kem",
    "libcrux-ml-dsa",
    "libcrux-ml-kem",
    "libcrux-ml-kem/fuzz",
    "libcrux-psq",
    "libcrux-psq/fuzz",
    "traits",
    "crates/algorithms/p384",
    "crates/algorithms/p384/fuzz",
    "crates/algorithms/nist-kdf",
]

# These crates are not part of the main libcrux library.
exclude = [
    "crates/sys/libjade",
    "crates/sys/lib25519",
    "crates/sys/pqclean",
    "crates/sys/hacl",
]

resolver = "2"

[workspace.package]
version = "0.0.5"
authors = ["Cryspen"]
license = "Apache-2.0"
homepage = "https://github.com/cryspen/libcrux"
edition = "2021"
rust-version = "1.89.0"
repository = "https://github.com/cryspen/libcrux"
readme = "Readme.md"

[workspace.metadata.release]
allow-branch = ["main"]

[workspace.dependencies]
hax-lib = { version = "0.4.1" }
libcrux-aead = { version = "=0.0.9", path = "crates/primitives/aead" }
libcrux-aes = { version = "=0.0.9", path = "crates/algorithms/aes" }
libcrux-blake2 = { version = "=0.0.8", path = "crates/algorithms/blake2" }
libcrux-chacha20poly1305 = { version = "=0.0.9", path = "crates/algorithms/chacha20poly1305" }
libcrux-poly1305 = { version = "=0.0.6", path = "crates/algorithms/poly1305" }
libcrux-ed25519 = { version = "=0.0.9", path = "crates/algorithms/ed25519" }
libcrux-hacl-rs = { version = "=0.0.5", path = "crates/utils/hacl-rs" }
libcrux-hkdf = { version = "=0.0.8", path = "crates/algorithms/hkdf" }
libcrux-hmac = { version = "=0.0.8", path = "crates/algorithms/hmac" }
libcrux-hmac-drbg = { version = "=0.0.1", path = "crates/algorithms/hmac-drbg" }
libcrux-kmac = { version = "=0.0.1", path = "crates/algorithms/kmac" }
libcrux-nist-kdf = { version = "=0.0.1", path = "crates/algorithms/nist-kdf" }
libcrux-intrinsics = { version = "=0.0.8", path = "crates/utils/intrinsics" }
libcrux-digest = { version = "=0.0.9", path = "crates/primitives/digest" }
libcrux-rsa = { version = "=0.0.8", path = "crates/algorithms/rsa" }
libcrux-sha2 = { version = "=0.0.8", path = "crates/algorithms/sha2" }
libcrux-sha3 = { version = "=0.0.10", path = "crates/algorithms/sha3" }
libcrux-platform = { version = "=0.0.3", path = "crates/sys/platform" }
libcrux-psq = { version = "=0.0.10", path = "libcrux-psq" }

# HPKE
hpke-rs = { version = "=0.7.0", path = "crates/protocols/hpke" }
hpke-rs-crypto = { version = "=0.7.0", path = "crates/protocols/hpke/traits", default-features = false }
hpke-rs-rust-crypto = { version = "=0.7.0", path = "crates/protocols/hpke/rust_crypto_provider", default-features = false }
hpke-rs-libcrux = { version = "=0.7.0", path = "crates/protocols/hpke/libcrux_provider", default-features = false }

# For the crates below it is necessary to set `default-features = true`
# in workspace crates that depend on the default feature set.
libcrux-kem = { version = "=0.0.9", path = "libcrux-kem", default-features = false }
libcrux-traits = { version = "=0.0.8", path = "traits" }
libcrux-ecdh = { version = "=0.0.8", path = "libcrux-ecdh", default-features = false }
libcrux-curve25519 = { version = "=0.0.8", path = "crates/algorithms/curve25519", default-features = false }
libcrux-ml-kem = { version = "=0.0.10", path = "libcrux-ml-kem", default-features = false }
libcrux-p256 = { version = "=0.0.8", path = "crates/algorithms/p256", default-features = false }
libcrux-p384 = { version = "=0.0.1", path = "crates/algorithms/p384", default-features = false }
libcrux-ecdsa = { version = "=0.0.8", path = "crates/algorithms/ecdsa", default-features = false }
libcrux-ml-dsa = { version = "=0.0.10", path = "libcrux-ml-dsa", default-features = false }

# Test utilities
libcrux-kats = { path = "crates/testing/kats" }

# Utilities
libcrux-macros = { version = "=0.0.3", path = "crates/utils/macros" }
libcrux-secrets = { version = "=0.0.6", path = "crates/utils/secrets" }

# Encodings
tls_codec = { version = "0.5.0", features = [
    "derive",
], default-features = false }

# 3rd Party
rand = { version = "0.10", default-features = false }
crabgrind = "0.3.1"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
bench = false                               # so libtest doesn't eat the arguments for criterion

[features]
default = ["std", "all"]
# Enables `std` support in the dependencies that have it.
std = [
    "libcrux-ecdsa?/std",
    "libcrux-kem?/std",
    "libcrux-ml-kem?/std",
    "libcrux-ml-dsa?/std",
    "hpke-rs?/std",
]
rand = []
wasm = ["wasm-bindgen", "getrandom"]
tests = [] # Expose functions for testing.
experimental = [] # Expose experimental APIs.

# All features. The `*-no-std` variants only enable features that build
# without `std`; the others additionally enable `std` and `std`-only features.
all-no-std = [
    "all-algorithms-no-std",
    "all-primitives-no-std",
    "all-protocols-no-std",
]
all = ["all-no-std", "all_algorithms", "all_primitives", "all_protocols"]

# Algorithms
all-algorithms-no-std = [
    "aes_aead",
    "blake2",
    "chacha20_poly1305",
    "curve25519",
    "ed25519",
    "p256_ecdh",
    "p256_ecdsa",
    "sha2",
    "sha3",
    "hkdf",
    "hmac",
    "kmac",
    "mlkem",
    "mldsa",
    "rsapss",
    "poly1305",
    "hmac_drbg",
    "nist_kdf",
]
all_algorithms = ["std", "all-algorithms-no-std"]
aes_aead = ["dep:libcrux-aes"]
blake2 = ["dep:libcrux-blake2"]
chacha20_poly1305 = ["dep:libcrux-chacha20poly1305"]
curve25519 = ["dep:libcrux-curve25519"]
ed25519 = ["dep:libcrux-ed25519"]
p256_ecdh = ["dep:libcrux-p256", "libcrux-p256/expose-hacl"]
p256_ecdsa = ["dep:libcrux-ecdsa", "libcrux-ecdsa/rand"]
sha2 = ["dep:libcrux-sha2"]
sha3 = ["dep:libcrux-sha3"]
hkdf = ["dep:libcrux-hkdf"]
hmac = ["dep:libcrux-hmac"]
kmac = ["dep:libcrux-kmac"]
mlkem = ["dep:libcrux-ml-kem", "libcrux-ml-kem/default-no-std"]
mldsa = [
    "dep:libcrux-ml-dsa",
    "libcrux-ml-dsa/mldsa44",
    "libcrux-ml-dsa/mldsa65",
    "libcrux-ml-dsa/mldsa87",
]
rsapss = ["dep:libcrux-rsa"]
poly1305 = ["dep:libcrux-poly1305"]
hmac_drbg = ["dep:libcrux-hmac-drbg"]
nist_kdf = ["dep:libcrux-nist-kdf"]

# Primitives
all-primitives-no-std = ["aead", "digest", "kem"]
all_primitives = ["std", "all-primitives-no-std"]
aead = ["dep:libcrux-aead"]
digest = ["dep:libcrux-digest"]
kem = ["dep:libcrux-kem"]

# Protocols
all-protocols-no-std = ["hpke"]
all_protocols = ["std", "all-protocols-no-std", "psq"]
hpke = ["dep:hpke-rs"]
psq = ["std", "dep:libcrux-psq"]                       # Requires `std`.

[dependencies]
getrandom = { version = "0.4", optional = true }
# WASM API
wasm-bindgen = { version = "0.2.87", optional = true }

# Workspace Dependencies
#
# NOTE: When a workspace dependency has set `default-features = true`,
# it can't be disabled in a crate that uses the workspace dependency,
# but if the workspace dependency has set `default-features = false`
# it *can* be enabled in the dependent crate. This means you need to
# check the workspace dependency to know whether default features are
# enabled or not and enable desired features in the dependent crate,
# if necessary.
hpke-rs = { workspace = true, features = ["libcrux"], optional = true }

# Primitives
libcrux-aead = { workspace = true, optional = true }
libcrux-digest = { workspace = true, optional = true }
libcrux-kem = { workspace = true, optional = true }

# Algorithms
libcrux-aes = { workspace = true, optional = true }
libcrux-blake2 = { workspace = true, optional = true }
libcrux-chacha20poly1305 = { workspace = true, optional = true }
libcrux-poly1305 = { workspace = true, optional = true }
libcrux-curve25519 = { workspace = true, optional = true }
libcrux-ecdsa = { workspace = true, optional = true }
libcrux-ed25519 = { workspace = true, optional = true }
libcrux-hkdf = { workspace = true, optional = true }
libcrux-hmac = { workspace = true, optional = true }
libcrux-hmac-drbg = { workspace = true, optional = true }
libcrux-kmac = { workspace = true, optional = true }
libcrux-ml-kem = { workspace = true, optional = true }
libcrux-ml-dsa = { workspace = true, optional = true }
libcrux-p256 = { workspace = true, optional = true }
libcrux-rsa = { workspace = true, optional = true }
libcrux-sha2 = { workspace = true, optional = true }
libcrux-sha3 = { workspace = true, optional = true }
libcrux-nist-kdf = { workspace = true, optional = true }

# Protocols
libcrux-psq = { workspace = true, optional = true }


[target.'cfg(hax)'.dependencies]
hax-lib.workspace = true

[build-dependencies]
libcrux-platform = { version = "=0.0.3", path = "crates/sys/platform" }

[dev-dependencies]

rand.workspace = true

clap = { version = "4.5", features = ["derive"] }
hex = { version = "0.4.3", features = ["serde"] }
libcrux = { path = ".", features = ["rand", "tests"] }
pretty_env_logger = "0.5"
rand_chacha = { version = "0.10.0" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.4" }
wasm-bindgen-test = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-debug]
inherits = "release"
debug = true
strip = false


# XXX: Not needed anymore, but nice for test speed
# [profile.dev.package."libcrux-ml-dsa"]
# opt-level = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(doc_cfg)',
    'cfg(simd128)',
    'cfg(simd256)',
    'cfg(aes_ni)',
] }
