[package]
name = "libcrux"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/libcrux/"
description = "The Formally Verified Cryptography Library"
exclude = [
    "combined_extraction",
    "c.sh",
    "/.devcontainer",
    "/.docker",
    "flake.lock",
    "flake.nix",
    "formal_verification",
    "fstar-helpers",
    "/.github",
    ".gitignore",
    "no-std-build.sh",
    "/tests",
    "/specs",
    "/proofs",
    "/*.py",
    "/wasm-demo",
    "/fuzz",
    "/git-hooks",
    "/architecture",
    "/libcrux.fst.config.json",
]

[workspace]
members = [
    "benchmarks",
    "crates/algorithms/aes",
    "crates/algorithms/blake2",
    "crates/algorithms/aes/fuzz",
    "crates/algorithms/chacha20poly1305",
    "crates/algorithms/curve25519",
    "crates/algorithms/ecdsa",
    "crates/algorithms/ed25519",
    "crates/algorithms/hkdf",
    "crates/algorithms/hmac",
    "crates/algorithms/hmac-drbg",
    "crates/algorithms/hmac-drbg/fuzz",
    "crates/algorithms/kmac",
    "crates/algorithms/p256",
    "crates/algorithms/poly1305",
    "crates/algorithms/rsa",
    "crates/algorithms/sha2",
    "crates/algorithms/sha3",
    "crates/primitives/aead",
    "crates/primitives/digest",
    "crates/protocols/hpke",
    "crates/protocols/hpke/libcrux_provider",
    "crates/protocols/hpke/rust_crypto_provider",
    "crates/protocols/hpke/traits",
    "crates/protocols/hpke/wasm",
    "crates/sys/platform",
    "crates/testing/kats",
    "crates/utils/core-models",
    "crates/utils/ctgrind-test",
    "crates/utils/hacl-rs",
    "crates/utils/intrinsics",
    "crates/utils/macros",
    "crates/utils/secrets",
    "crates/utils/test-utils",
    "libcrux-ecdh",
    "libcrux-kem",
    "libcrux-ml-dsa",
    "libcrux-ml-kem",
    "libcrux-ml-kem/fuzz",
    "libcrux-psq",
    "libcrux-psq/fuzz",
    "traits",
]

# These crates are not part of the main libcrux library.
exclude = [
    "crates/sys/libjade",
    "crates/sys/lib25519",
    "crates/sys/pqclean",
    "crates/sys/hacl",
]

resolver = "2"

[workspace.package]
version = "0.0.5"
authors = ["Cryspen"]
license = "Apache-2.0"
homepage = "https://github.com/cryspen/libcrux"
edition = "2021"
rust-version = "1.89.0"
repository = "https://github.com/cryspen/libcrux"
readme = "Readme.md"

[workspace.metadata.release]
allow-branch = ["main"]

[workspace.dependencies]
# hax at the #2261 merge commit on `main`. Two things need it, both past the
# `cargo-hax-v0.4.0` tag (f8fe6933): the sha3 `Proof_utils.Lemmas` reveal
# `Core_models.Num.impl_u64__rotate_left`, a transparent `opaque_to_smt` let only
# from #2235 on (at the tag it is an `assume val`, so `reveal_opaque` fails); and
# `Core_models.Specs.Num.{Abs,Count_ones,To_le_bytes}` + `Rand_core.Specs.Fill_bytes`,
# which the ml-kem/ml-dsa primitive proofs cite. #2261 renamed those out of the
# `Core_models.Num.*_spec` namespace they carried on the review branch, so the
# citations moved with it. Also carries the macro_rules! antiquote span-hygiene
# fix (PR #2212 / b78d945) the crate-wide `proof!` markers require.
# Extract with `OPAMSWITCH=hax-0.4.0 opam exec -- <crate>/hax.py extract`.
#
# A REVISION, not a branch ref. `Cargo.lock` is gitignored here, so a branch ref
# lets two checkouts — or the same checkout a week apart — resolve different
# foundations with no diff to show for it. The committed `.hints` are recorded
# against a specific foundation: hax-lib 85d6c4e98 dropped one unused `open` from
# `Rust_primitives.Hax.Folds.fsti`, semantically a no-op, and that alone changed
# the module digest and invalidated the recorded unsat core of every proof
# containing a `for` loop (hax extracts those as `fold_range` through that
# module) — 379 hint files had to be re-recorded. Under a floating ref such a
# move is silent, and any re-record is stale on arrival. Bump this rev
# deliberately, re-extract, and re-record hints in the same commit. The previous
# pin (85d6c4e98) sat on `feat/core-prim-specs`, which was deleted after the
# merge; a rev on a review branch stops being fetchable once that happens, which
# is why this tracks `main`. Move to a tag once one containing #2261 is cut.
hax-lib = { git = "https://github.com/cryspen/hax", rev = "7ea953eb4131fb3f4751acff57251da66247f104" }
libcrux-aead = { version = "=0.0.9", path = "crates/primitives/aead" }
libcrux-aes = { version = "=0.0.9", path = "crates/algorithms/aes" }
libcrux-blake2 = { version = "=0.0.8", path = "crates/algorithms/blake2" }
libcrux-chacha20poly1305 = { version = "=0.0.9", path = "crates/algorithms/chacha20poly1305" }
libcrux-poly1305 = { version = "=0.0.6", path = "crates/algorithms/poly1305" }
libcrux-ecdsa = { version = "=0.0.8", path = "crates/algorithms/ecdsa" }
libcrux-ed25519 = { version = "=0.0.9", path = "crates/algorithms/ed25519" }
libcrux-hacl-rs = { version = "=0.0.5", path = "crates/utils/hacl-rs" }
libcrux-hkdf = { version = "=0.0.8", path = "crates/algorithms/hkdf" }
libcrux-hmac = { version = "=0.0.8", path = "crates/algorithms/hmac" }
libcrux-hmac-drbg = { version = "=0.0.1", path = "crates/algorithms/hmac-drbg" }
libcrux-kmac = { version = "=0.0.1", path = "crates/algorithms/kmac" }
libcrux-intrinsics = { version = "=0.0.8", path = "crates/utils/intrinsics" }
libcrux-digest = { version = "=0.0.9", path = "crates/primitives/digest" }
libcrux-rsa = { version = "=0.0.8", path = "crates/algorithms/rsa" }
libcrux-sha2 = { version = "=0.0.8", path = "crates/algorithms/sha2" }
libcrux-sha3 = { version = "=0.0.10", path = "crates/algorithms/sha3" }
libcrux-ml-dsa = { version = "=0.0.10", path = "libcrux-ml-dsa" }
libcrux-platform = { version = "=0.0.3", path = "crates/sys/platform" }
libcrux-psq = { version = "=0.0.10", path = "libcrux-psq" }

# HPKE
hpke-rs = { version = "=0.7.0", path = "crates/protocols/hpke" }
hpke-rs-crypto = { version = "=0.7.0", path = "crates/protocols/hpke/traits", default-features = false }
hpke-rs-rust-crypto = { version = "=0.7.0", path = "crates/protocols/hpke/rust_crypto_provider", default-features = false }
hpke-rs-libcrux = { version = "=0.7.0", path = "crates/protocols/hpke/libcrux_provider", default-features = false }

# For the crates below it is necessary to set `default-features = true`
# in workspace crates that depend on the default feature set.
libcrux-kem = { version = "=0.0.9", path = "libcrux-kem", default-features = false }
libcrux-traits = { version = "=0.0.8", path = "traits" }
libcrux-ecdh = { version = "=0.0.8", path = "libcrux-ecdh", default-features = false }
libcrux-curve25519 = { version = "=0.0.8", path = "crates/algorithms/curve25519", default-features = false }
libcrux-ml-kem = { version = "=0.0.10", path = "libcrux-ml-kem", default-features = false }
libcrux-p256 = { version = "=0.0.8", path = "crates/algorithms/p256", default-features = false }

# Test utilities
libcrux-kats = { path = "crates/testing/kats" }

# Utilities
libcrux-macros = { version = "=0.0.3", path = "crates/utils/macros" }
libcrux-secrets = { version = "=0.0.6", path = "crates/utils/secrets" }

# Encodings
 tls_codec = { version = "0.5.0", features = ["derive"], default-features = false }

# 3rd Party
rand = { version = "0.10", default-features = false }
crabgrind = "0.3.1"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
bench = false                               # so libtest doesn't eat the arguments for criterion

[features]
default = ["std", "all"]
std = []
rand = []
wasm = ["wasm-bindgen", "getrandom"]
tests = []                                                  # Expose functions for testing.
experimental = []                                           # Expose experimental APIs.
all = ["all_algorithms", "all_primitives", "all_protocols"]

# Algorithms
all_algorithms = [
    "aes_aead",
    "blake2",
    "chacha20_poly1305",
    "curve25519",
    "ed25519",
    "p256_ecdh",
    "p256_ecdsa",
    "sha2",
    "sha3",
    "hkdf",
    "hmac",
    "kmac",
    "mlkem",
    "mldsa",
    "rsapss",
    "poly1305",
    "hmac_drbg",
]
aes_aead = []
blake2 = []
chacha20_poly1305 = []
curve25519 = []
ed25519 = []
p256_ecdh = []
p256_ecdsa = []
sha2 = []
sha3 = []
hkdf = []
hmac = []
kmac = []
mlkem = []
mldsa = []
rsapss = []
poly1305 = []
hmac_drbg = []

# Primitives
all_primitives = ["aead", "digest", "kem"]
aead = []
digest = []
kem = []

# Protocols
all_protocols = ["hpke", "psq"]
hpke = []
psq = []

[dependencies]
getrandom = { version = "0.4", optional = true }

# Proofs
hax-lib.workspace = true

# External Cryspen code.
hpke-rs = { workspace = true, features = ["libcrux"] }

# Primitives
libcrux-aead.workspace = true
libcrux-digest.workspace = true
libcrux-kem = { workspace = true, default-features = true }

# Algorithms
libcrux-aes.workspace = true
libcrux-blake2.workspace = true
libcrux-chacha20poly1305.workspace = true
libcrux-poly1305.workspace = true
libcrux-curve25519.workspace = true
libcrux-ecdh.workspace = true
libcrux-ecdsa.workspace = true
libcrux-ed25519.workspace = true
libcrux-hkdf.workspace = true
libcrux-hmac.workspace = true
libcrux-hmac-drbg.workspace = true
libcrux-kmac.workspace = true
libcrux-ml-kem.workspace = true
libcrux-ml-dsa.workspace = true
libcrux-p256.workspace = true
libcrux-rsa.workspace = true
libcrux-sha2.workspace = true
libcrux-sha3.workspace = true

# Protocols
libcrux-psq.workspace = true

# WASM API
wasm-bindgen = { version = "0.2.87", optional = true }

[build-dependencies]
libcrux-platform = { version = "=0.0.3", path = "crates/sys/platform" }

[dev-dependencies]

rand.workspace = true

clap = { version = "4.5", features = ["derive"] }
hex = { version = "0.4.3", features = ["serde"] }
libcrux = { path = ".", features = ["rand", "tests"] }
pretty_env_logger = "0.5"
rand_chacha = { version = "0.10.0" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.4" }
wasm-bindgen-test = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-debug]
inherits = "release"
debug = true
strip = false


# XXX: Not needed anymore, but nice for test speed
# [profile.dev.package."libcrux-ml-dsa"]
# opt-level = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(doc_cfg)',
    'cfg(simd128)',
    'cfg(simd256)',
    'cfg(aes_ni)',
] }

