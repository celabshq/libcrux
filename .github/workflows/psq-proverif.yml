name: PSQ - ProVerif

# ProVerif analysis of the libcrux-psq PSQ handshake.
#
# check-pv.sh re-extracts the handshake via `cargo hax ... into proverif`,
# composes it with the symbolic crypto model (psq_crypto.pvl) and checks the
# verdicts of the analyses. CI runs it with `--light`, which skips the DH
# session analysis and the sig session R3/R3i queries: they need 28 to 51 GB,
# more than a GitHub runner has. The other analyses take about 25 minutes and
# less than 11 GB. Run the skipped ones locally with `check-pv.sh` (about 1h10,
# 55 GB).

on:
  push:
    paths:
      - "libcrux-psq/**"
      - ".github/workflows/psq-proverif.yml"
  pull_request:
    paths:
      - "libcrux-psq/**"
      - ".github/workflows/psq-proverif.yml"
  workflow_dispatch:

env:
  HAX_REPOSITORY: pereq-dev/hax
  HAX_REFERENCE: cargo-hax-v0.5.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proverif-psq:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: ⤵ Install hax
        uses: hacspec/hax-actions@1f01b89579f425ad7c1e66aebbd5df7e688cb576
        with:
          hax_repository: github:${{ env.HAX_REPOSITORY }}
          hax_reference: ${{ env.HAX_REFERENCE }}

      - name: Fetch hax proof libs (sparse)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HAX_REPOSITORY }}
          ref: ${{ env.HAX_REFERENCE }}
          path: hax-engine
          sparse-checkout: |
            hax-lib/proof-libs/proverif
          sparse-checkout-cone-mode: false

      - name: Install ProVerif
        run: |
          sudo apt-get update
          sudo apt-get install -y opam ocaml libgtk2.0-dev
          opam init -y --disable-sandboxing
          eval "$(opam env)"
          opam install -y proverif

      - name: Re-extract + run the light ProVerif analysis
        env:
          HAX_HOME: ${{ github.workspace }}/hax-engine
        run: |
          eval "$(opam env)"
          bash libcrux-psq/proofs/proverif/check-pv.sh --light
