name: KMAC - hax

permissions: {}

on:
  merge_group:
  pull_request:
    branches: ["dev", "main"]
    paths:
      - "crates/algorithms/kmac/**"
      - "crates/algorithms/sha3/**"

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FSTAR_REV: v2026.03.24
  HAX_LIB_VERSION: 0.4.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract-portable:
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: hacspec/hax-actions@main
        with:
          hax_reference: hax-lib-v${{ env.HAX_LIB_VERSION }}
          fstar: ${{ env.FSTAR_REV }}

      - name: Use precise version of hax-lib
        run: cargo update hax-lib --precise $HAX_LIB_VERSION

      - name: 🏃 Extract KMAC crate (portable)
        working-directory: crates/algorithms/kmac
        run: ./hax.py extract

      - name: ↑ Upload F* extraction (standard)
        uses: actions/upload-artifact@v7
        with:
          name: fstar-extractions-portable
          path: "**/proofs/fstar"
          include-hidden-files: true
          if-no-files-found: error

  lax-portable:
    runs-on: ubuntu-latest
    needs:
      - extract-portable
    if: ${{ github.event_name != 'merge_group' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: hacspec/hax-actions@main
        with:
          hax_reference: hax-lib-v${{ env.HAX_LIB_VERSION }}
          fstar: ${{ env.FSTAR_REV }}

      - name: Use precise version of hax-lib
        run: cargo update hax-lib --precise $HAX_LIB_VERSION

      - uses: actions/download-artifact@v8
        with:
          name: fstar-extractions-portable
          path: .

      - name: 🏃 Lax KMAC crate (portable)
        working-directory: crates/algorithms/kmac
        run: ./hax.py prove --admit

  type-check-portable:
    runs-on: ubuntu-latest
    needs:
      - extract-portable
    if: ${{ github.event_name != 'merge_group' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: hacspec/hax-actions@main
        with:
          hax_reference: hax-lib-v${{ env.HAX_LIB_VERSION }}
          fstar: ${{ env.FSTAR_REV }}

      - name: Use precise version of hax-lib
        run: cargo update hax-lib --precise $HAX_LIB_VERSION

      - uses: actions/download-artifact@v8
        with:
          name: fstar-extractions-portable
          path: .

      - name: 🏃 Full type check KMAC crate (portable)
        working-directory: crates/algorithms/kmac
        run: ./hax.py prove

  kmac-extract-hax-status:
    if: ${{ always() }}
    needs: [extract-portable]
    runs-on: ubuntu-latest
    steps:
      - name: Successful
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failing
        if: ${{ (contains(needs.*.result, 'failure')) }}
        run: exit 1

  kmac-type-check-portable-hax-status:
    if: ${{ always() }}
    needs: [lax-portable, type-check-portable]
    runs-on: ubuntu-latest
    steps:
      - name: Successful
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failing
        if: ${{ (contains(needs.*.result, 'failure')) }}
        run: exit 1
