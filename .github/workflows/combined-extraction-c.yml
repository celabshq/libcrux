name: Combined Extraction - Build & Test C

on:
  merge_group:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All C extractions are checked by the same reusable workflow, see
# c-extraction.yml. One extraction run produces both output directories.
jobs:
  combined:
    uses: ./.github/workflows/c-extraction.yml
    with:
      extraction: combined

  combined-c-tests-status:
    if: ${{ always() }}
    needs:
      - combined
    runs-on: ubuntu-latest
    steps:
      - name: Successful
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failing
        if: ${{ (contains(needs.*.result, 'failure')) }}
        run: exit 1

