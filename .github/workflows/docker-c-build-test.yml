name: Rebuild C Docker image

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths: ['.docker/c/**']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-c
  VERSION_TAG: unstable

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    # We need write access to packages
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .docker/c/
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }}
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }}

  # Check every C extraction with the new image, the same way the regular
  # C workflows do (see c-extraction.yml).
  ml-kem-c:
    needs: [build-and-push-image]
    uses: ./.github/workflows/c-extraction.yml
    with:
      extraction: ml-kem-c
      image: ${{ needs.build-and-push-image.outputs.image }}
      force-extract: true

  ml-kem-c-header-only:
    needs: [build-and-push-image]
    uses: ./.github/workflows/c-extraction.yml
    with:
      extraction: ml-kem-c-header-only
      image: ${{ needs.build-and-push-image.outputs.image }}
      force-extract: true

  ml-kem-cpp-header-only:
    needs: [build-and-push-image]
    uses: ./.github/workflows/c-extraction.yml
    with:
      extraction: ml-kem-cpp-header-only
      image: ${{ needs.build-and-push-image.outputs.image }}
      force-extract: true

  ml-dsa-header-only:
    needs: [build-and-push-image]
    uses: ./.github/workflows/c-extraction.yml
    with:
      extraction: ml-dsa-header-only
      image: ${{ needs.build-and-push-image.outputs.image }}
      force-extract: true

  combined:
    needs: [build-and-push-image]
    uses: ./.github/workflows/c-extraction.yml
    with:
      extraction: combined
      image: ${{ needs.build-and-push-image.outputs.image }}
      force-extract: true
