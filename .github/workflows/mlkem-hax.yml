name: ML-KEM - hax

on:
  merge_group:
  push:
    branches: ["dev", "main"]

  pull_request:
    branches: ["dev", "main"]

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      hax_ref:
        description: "The hax revision you want this job to use"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  FSTAR_REV: v2026.03.24

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-hax-ref:
    uses: ./.github/workflows/get-hax-ref.yml

  extract:
    runs-on: ubuntu-latest
    needs:
      - get-hax-ref

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacspec/hax-actions@main
        with:
          hax_reference: ${{ github.event.inputs.hax_ref || needs.get-hax-ref.outputs.hax_ref }}
          fstar: ${{ env.FSTAR_REV }}
          
      - name: 🏃 Extract ML-KEM crate
        working-directory: libcrux-ml-kem
        run: ./hax.py extract

      - name: ↑ Upload F* extraction
        uses: actions/upload-artifact@v7
        with:
          name: fstar-extractions
          path: "**/proofs/fstar"
          include-hidden-files: true
          if-no-files-found: error

  lax:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'merge_group' }}
    needs:
      - get-hax-ref
      - extract

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacspec/hax-actions@main
        with:
          hax_reference: ${{ github.event.inputs.hax_ref || needs.get-hax-ref.outputs.hax_ref }}
          fstar: ${{ env.FSTAR_REV }}
          
      - uses: actions/download-artifact@v8
        with:
          name: fstar-extractions
          path: .
      - name: 🏃 Lax ML-KEM crate
        working-directory: libcrux-ml-kem
        run: ./hax.py prove --admit
        
  # XXX: Is the caching performed by hacspec/hax-actions enough to get CI minutes down for paid runners?
