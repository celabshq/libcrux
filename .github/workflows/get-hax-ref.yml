name: Get hax rev

on:
  workflow_call:
    outputs:
      hax_ref:
        description: "the tag for the hax revision"
        value: ${{ jobs.get-hax-ref.outputs.hax_ref }}


    
jobs:
  get-hax-ref:
    runs-on: ubuntu-latest
    outputs:
      hax_ref: ${{ steps.step1.outputs.hax_ref }}
    steps:
      - uses: actions/checkout@v6
      - id: step1
        run: |
          # Use hax at the version the Cargo.toml of libcrux pins hax-lib to.
          # Pick the hax-lib the workspace depends on directly, not one a transitive
          # dependency drags in (two hax-lib versions in the graph would otherwise
          # make this a multi-line, invalid output).
          HAX_VERSION="$(cargo metadata --format-version=1 | jq -r '. as $m | [$m.workspace_members[] as $w | $m.resolve.nodes[] | select(.id == $w) | .deps[] | .pkg] as $direct | first(.packages[] | select(.name=="hax-lib" and (.id as $i | $direct | index($i)))) | .version')"
          echo "hax_ref=hax-lib-v$HAX_VERSION" >> $GITHUB_OUTPUT
          echo "Using hax $HAX_VERSION"
