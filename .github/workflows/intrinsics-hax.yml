name: Intrinsics - hax

# Verifies the four REAL ARM64 NEON SHA3-extension *fallback* implementations
# in crates/utils/intrinsics/src/arm64_extract.rs
#   _veor3q_u64 / _vbcaxq_u64 / _vrax1q_u64 / _vxarq_u64
# against their #[hax_lib::ensures] specs. These are not unimplemented!() model
# ops — they have real bodies — but until now only the .fsti interface was
# built in any consumer, so their specs were trusted as axioms. This job
# actually proves them, in isolation, via the hand-written proof modules under
# fstar-helpers/fstar-bitvec/ (rooted by crates/utils/intrinsics/proofs/fstar/Makefile).

on:
  merge_group:
    paths:
      - "crates/utils/intrinsics/**"
      - "crates/utils/core-models/**"
      - "fstar-helpers/fstar-bitvec/Bitvec.U64Rotate.fst"
      - "fstar-helpers/fstar-bitvec/Bitvec.Arm64Views.fst"
      - "fstar-helpers/fstar-bitvec/Bitvec.VxarqProof.fst"
      - "fstar-helpers/fstar-bitvec/Bitvec.Sha3FallbackProof.fst"
      - ".github/workflows/intrinsics-hax.yml"
  pull_request:
    branches: ["dev", "main"]
    paths:
      - "crates/utils/intrinsics/**"
      - "crates/utils/core-models/**"
      - "fstar-helpers/fstar-bitvec/Bitvec.U64Rotate.fst"
      - "fstar-helpers/fstar-bitvec/Bitvec.Arm64Views.fst"
      - "fstar-helpers/fstar-bitvec/Bitvec.VxarqProof.fst"
      - "fstar-helpers/fstar-bitvec/Bitvec.Sha3FallbackProof.fst"
      - ".github/workflows/intrinsics-hax.yml"

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      hax_ref:
        description: "The hax revision you want this job to use"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pin hax to the revision matching the hax-lib version in Cargo.toml.
  get-hax-ref:
    uses: ./.github/workflows/get-hax-ref.yml

  verify-fallbacks:
    runs-on: ubuntu-latest
    needs:
      - get-hax-ref
    steps:
      - uses: actions/checkout@v6
      - uses: hacspec/hax-actions@main
        with:
          hax_reference: ${{ github.event.inputs.hax_ref || needs.get-hax-ref.outputs.hax_ref }}
          fstar: v2026.03.24

      - name: 🏃 Extract shared deps (platform, core-models)
        run: |
          # The REAL `Libcrux_intrinsics.Arm64` (below) references the EXTRACTED
          # core-models model (`Libcrux_core_models.Core_arch.Arm.*`,
          # `Libcrux_core_models.Neon_views`, ...), so core-models (and its
          # platform dep) must be hax-extracted first — via their canonical
          # hax.py, exactly as crates/algorithms/sha3/hax.sh's dep_extract does.
          python3 crates/sys/platform/hax.py extract
          python3 crates/utils/core-models/hax.py extract

      - name: 🏃 Extract intrinsics crate (real core-models Arm64)
        working-directory: crates/utils/intrinsics
        run: |
          # Real core-models flip: NO `--cfg pre_core_models`, so lib.rs routes
          # simd128 -> the REAL core-models `Libcrux_intrinsics.Arm64` instead of
          # the retired `arm64_extract.rs` bit_vec stub. This removes the last CI
          # dependency on arm64_extract.rs. `-i "-libcrux_core_models::**"` keeps
          # the (already-extracted) core-models crate external, and
          # `--interfaces "-**"` keeps the real module TRANSPARENT (no .fsti) so
          # the `Bitvec.Arm64Views` op-facts can reduce each `e_*` wrapper to its
          # `Neon.*` model. Matches crates/algorithms/sha3/hax.sh's intrinsics
          # invocation.
          cargo hax \
            -C --features simd128,simd256 ";" \
            into -i "-libcrux_core_models::**" \
            fstar --z3rlimit 80 --interfaces "-**"
          # Canonical extract() rename (Core_models.* -> Libcrux_core_models.*).
          # No .fsti under `--interfaces "-**"`, so only .fst files are rewritten.
          sed -i \
            -e 's/Core_models\.Abstractions/Libcrux_core_models.Abstractions/g' \
            -e 's/Core_models\.Core_arch/Libcrux_core_models.Core_arch/g' \
            proofs/fstar/extraction/*.fst

      - name: 🏃 Verify NEON SHA3 fallback proofs (F*)
        working-directory: crates/utils/intrinsics/proofs/fstar
        run: make verify -j "$(nproc)"

  intrinsics-hax-status:
    if: ${{ always() }}
    needs: [get-hax-ref, verify-fallbacks]
    runs-on: ubuntu-latest
    steps:
      - name: Successful
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failing
        if: ${{ (contains(needs.*.result, 'failure')) }}
        run: exit 1
