name: ML-DSA - Build & Test C

on:
  merge_group:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All C extractions are checked by the same reusable workflow, see
# c-extraction.yml.
jobs:
  header-only:
    uses: ./.github/workflows/c-extraction.yml
    with:
      extraction: ml-dsa-header-only

  mldsa-c-tests-status:
    if: ${{ always() }}
    needs:
      - header-only
    runs-on: ubuntu-latest
    steps:
      - name: Successful
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failing
        if: ${{ (contains(needs.*.result, 'failure')) }}
        run: exit 1
