name: Publish ACVP-Server Docker image

# Builds the ACVP-Server gen/val image in .docker/acvp-server and publishes it, tagged with the
# git tree hash of that directory. `cargo xtask acvp` pulls the image with the same tag, and only
# builds it when it has not been published yet.
#
# Each platform is built natively and pushed by digest; the merge job creates the multi-platform
# tags.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".docker/acvp-server/**"]

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Image name
        id: image
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}-acvp-server" >> "$GITHUB_OUTPUT"
          platform=${{ matrix.platform }}
          echo "platform=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .docker/acvp-server/
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.image.outputs.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Image name
        id: image
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}-acvp-server" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse HEAD:.docker/acvp-server)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Create and push the multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          name=${{ steps.image.outputs.name }}
          docker buildx imagetools create \
            -t "$name:${{ steps.image.outputs.tag }}" \
            -t "$name:latest" \
            $(printf "$name@sha256:%s " *)
