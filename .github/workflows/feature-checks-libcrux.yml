name: Feature Checks - libcrux

# Checks that `libcrux` builds with different feature combinations, using
# `cargo hack`.
# The paths cover `libcrux` and its workspace dependencies.
# Too many features for a powerset; the crate is also not buildable without `std` (staticlib/cdylib crate types).
on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - ".github/workflows/feature-checks-libcrux.yml"
      - "build.rs"
      - "crates/algorithms/aes/**"
      - "crates/algorithms/blake2/**"
      - "crates/algorithms/chacha20poly1305/**"
      - "crates/algorithms/curve25519/**"
      - "crates/algorithms/ecdsa/**"
      - "crates/algorithms/ed25519/**"
      - "crates/algorithms/hkdf/**"
      - "crates/algorithms/hmac-drbg/**"
      - "crates/algorithms/hmac/**"
      - "crates/algorithms/kmac/**"
      - "crates/algorithms/nist-kdf/**"
      - "crates/algorithms/p256/**"
      - "crates/algorithms/p384/**"
      - "crates/algorithms/poly1305/**"
      - "crates/algorithms/rsa/**"
      - "crates/algorithms/sha2/**"
      - "crates/algorithms/sha3/**"
      - "crates/primitives/aead/**"
      - "crates/primitives/digest/**"
      - "crates/protocols/hpke/**"
      - "crates/protocols/hpke/libcrux_provider/**"
      - "crates/protocols/hpke/rust_crypto_provider/**"
      - "crates/protocols/hpke/traits/**"
      - "crates/sys/platform/**"
      - "crates/utils/core-models/**"
      - "crates/utils/hacl-rs/**"
      - "crates/utils/intrinsics/**"
      - "crates/utils/macros/**"
      - "crates/utils/secrets/**"
      - "libcrux-ecdh/**"
      - "libcrux-kem/**"
      - "libcrux-ml-dsa/**"
      - "libcrux-ml-kem/**"
      - "libcrux-psq/**"
      - "src/**"
      - "traits/**"
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - ".github/workflows/feature-checks-libcrux.yml"
      - "build.rs"
      - "crates/algorithms/aes/**"
      - "crates/algorithms/blake2/**"
      - "crates/algorithms/chacha20poly1305/**"
      - "crates/algorithms/curve25519/**"
      - "crates/algorithms/ecdsa/**"
      - "crates/algorithms/ed25519/**"
      - "crates/algorithms/hkdf/**"
      - "crates/algorithms/hmac-drbg/**"
      - "crates/algorithms/hmac/**"
      - "crates/algorithms/kmac/**"
      - "crates/algorithms/nist-kdf/**"
      - "crates/algorithms/p256/**"
      - "crates/algorithms/p384/**"
      - "crates/algorithms/poly1305/**"
      - "crates/algorithms/rsa/**"
      - "crates/algorithms/sha2/**"
      - "crates/algorithms/sha3/**"
      - "crates/primitives/aead/**"
      - "crates/primitives/digest/**"
      - "crates/protocols/hpke/**"
      - "crates/protocols/hpke/libcrux_provider/**"
      - "crates/protocols/hpke/rust_crypto_provider/**"
      - "crates/protocols/hpke/traits/**"
      - "crates/sys/platform/**"
      - "crates/utils/core-models/**"
      - "crates/utils/hacl-rs/**"
      - "crates/utils/intrinsics/**"
      - "crates/utils/macros/**"
      - "crates/utils/secrets/**"
      - "libcrux-ecdh/**"
      - "libcrux-kem/**"
      - "libcrux-ml-dsa/**"
      - "libcrux-ml-kem/**"
      - "libcrux-psq/**"
      - "src/**"
      - "traits/**"
  # Weekly, to catch breakage from new releases of third-party dependencies,
  # which the path filters can't detect (there is no committed Cargo.lock).
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x86_64:
    name: libcrux (x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cargo-hack
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-hack

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: feature-check-libcrux

      # `--no-dev-deps` keeps dev-dependencies from enabling features that
      # would otherwise hide missing feature dependencies.
      - name: 🔨 Check feature combinations
        run: >-
          cargo hack check -p libcrux
          --each-feature --no-dev-deps --keep-going --features std
