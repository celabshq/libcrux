name: Build AES-AEADs (RISC-V & ARM targets)

on:
  merge_group:
  pull_request:
    branches: ["main", "dev", "*"]
    paths:
      - "crates/algorithms/aes/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-nostd:
    runs-on: ubuntu-latest
    strategy:
        matrix:
            target: [thumbv7em-none-eabihf, thumbv7em-none-eabi, thumbv8m.main-none-eabihf, riscv64gc-unknown-none-elf]
    defaults:
      run:
        shell: bash
        working-directory: crates/algorithms/aes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Update dependencies
        run: cargo update

      # Install rust toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
            targets: ${{ matrix.target }}
        name: Install target Rust toolchain

      # Build
      - name: Build
        run: |
          cargo build --target ${{ matrix.target }}

      - name: Build Release
        run: |
          cargo build --release --target ${{ matrix.target }}

  test:
    runs-on: ubuntu-latest
    strategy:
        fail-fast: false
        matrix:
            target: [riscv64gc-unknown-linux-gnu, armv7-unknown-linux-gnueabihf]
    defaults:
      run:
        shell: bash
        working-directory: crates/algorithms/aes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install target Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
            toolchain: stable
            targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cross@0.2.5

      - name: Test
        run: |
          cross test --verbose --target ${{ matrix.target }}

      - name: Test Release
        run: |
          cross test --verbose --target ${{ matrix.target }} --release
