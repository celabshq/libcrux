name: SHA3 - hax

on:
  merge_group:
  pull_request:
    branches: ["dev", "main"]
    paths:
      - "crates/algorithms/sha3/**"

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      hax_ref:
        description: "The hax revision you want this job to use"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  FSTAR_REV: v2026.03.24

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-hax-ref:
    uses: ./.github/workflows/get-hax-ref.yml

  extract-portable:
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    needs:
      - get-hax-ref

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacspec/hax-actions@main
        with:
          hax_reference: ${{ github.event.inputs.hax_ref || needs.get-hax-ref.outputs.hax_ref }}
          fstar: ${{ env.FSTAR_REV }}
          
      - name: 🏃 Extract SHA3 crate (portable)
        working-directory: crates/algorithms/sha3
        run: ./hax.sh extract

      - name: ↑ Upload F* extraction (standard)
        uses: actions/upload-artifact@v7
        with:
          name: fstar-extractions-portable
          path: "**/proofs/fstar"
          include-hidden-files: true
          if-no-files-found: error

  lax-portable:
    runs-on: ubuntu-latest
    needs:
      - get-hax-ref
      - extract-portable
    if: ${{ github.event_name != 'merge_group' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacspec/hax-actions@main
        with:
          hax_reference: ${{ github.event.inputs.hax_ref || needs.get-hax-ref.outputs.hax_ref }}
          fstar: ${{ env.FSTAR_REV }}

      - uses: actions/download-artifact@v8
        with:
          name: fstar-extractions-portable
          path: .

      - name: 🏃 Lax SHA3 crate (portable)
        working-directory: crates/algorithms/sha3
        run: ./hax.sh prove --admit

  type-check-portable:
    runs-on: ubuntu-latest
    needs:
      - get-hax-ref
      - extract-portable
    if: ${{ github.event_name != 'merge_group' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacspec/hax-actions@main
        with:
          hax_reference: ${{ github.event.inputs.hax_ref || needs.get-hax-ref.outputs.hax_ref }}
          fstar: ${{ env.FSTAR_REV }}

      - uses: actions/download-artifact@v8
        with:
          name: fstar-extractions-portable
          path: .

      - name: 🏃 Full type check SHA3 crate (portable)
        working-directory: crates/algorithms/sha3
        run: ./hax.sh prove

  sha3-extract-hax-status:
    if: ${{ always() }}
    needs: [extract-portable]
    runs-on: ubuntu-latest
    steps:
      - name: Successful
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failing
        if: ${{ (contains(needs.*.result, 'failure')) }}
        run: exit 1

  sha3-type-check-portable-hax-status:
    if: ${{ always() }}
    needs: [lax-portable, type-check-portable]
    runs-on: ubuntu-latest
    steps:
      - name: Successful
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failing
        if: ${{ (contains(needs.*.result, 'failure')) }}
        run: exit 1
