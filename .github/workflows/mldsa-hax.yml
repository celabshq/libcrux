  #   runs-on: #TODO
  #   if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  #   needs:
  #     - extract
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
  #     - uses: hacspec/hax-actions@main
  #       with:
  #         hax_reference: hax-lib-v${{ env.HAX_LIB_VERSION }}
  #         fstar: ${{ env.FSTAR_REV }}
          
  #     - name: Use precise version of hax-lib
  #       run: cargo update hax-lib --precise $HAX_LIB_VERSION

  #     - uses: actions/download-artifact@v8
  #       with:
  #         name: fstar-extractions
  #         path: .

  #     - name: 🏃 Prove ML-DSA crate
  #       working-directory: libcrux-ml-dsa
  #       run: ./hax.sh prove
        
  mldsa-extract-hax-status:
    if: ${{ always() }}
    needs: [extract]
    runs-on: ubuntu-latest
    steps:
      - name: Successful
        if: ${{ !(contains(needs.*.result, 'failure')) }} 
        run: exit 0 
      - name: Failing
        if: ${{ (contains(needs.*.result, 'failure')) }} 
        run: exit 1 

  mldsa-lax-hax-status:
    if: ${{ always() }}
    needs: [lax]
    runs-on: ubuntu-latest
    steps:
      - name: Successful
        if: ${{ !(contains(needs.*.result, 'failure')) }} 
        run: exit 0 
      - name: Failing
        if: ${{ (contains(needs.*.result, 'failure')) }} 
        run: exit 1 
