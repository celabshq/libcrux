name: ML-DSA - hax

on:
  merge_group:
  push:
    branches: ["dev", "main"]

  pull_request:
    branches: ["dev", "main"]

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FSTAR_REV: v2026.03.24
  HAX_LIB_VERSION: 0.4.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacspec/hax-actions@main
        with:
          hax_reference: hax-lib-v${{ env.HAX_LIB_VERSION }}
          fstar: ${{ env.FSTAR_REV }}
          
      - name: Use precise version of hax-lib
        run: cargo update hax-lib --precise $HAX_LIB_VERSION

      - name: 🏃 Extract ML-DSA crate
        working-directory: libcrux-ml-dsa
        run: ./hax.sh extract

      - name: ↑ Upload F* extraction
        uses: actions/upload-artifact@v7
        with:
          name: fstar-extractions
          path: "**/proofs/fstar"
          include-hidden-files: true
          if-no-files-found: error

  lax:
    runs-on: ubuntu-latest
    needs:
      - extract
    if: ${{ github.event_name != 'merge_group' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacspec/hax-actions@main
        with:
          hax_reference: hax-lib-v${{ env.HAX_LIB_VERSION }}
          fstar: ${{ env.FSTAR_REV }}
          
      - name: Use precise version of hax-lib
        run: cargo update hax-lib --precise $HAX_LIB_VERSION

      - uses: actions/download-artifact@v8
        with:
          name: fstar-extractions
          path: .

      - name: 🏃 Lax ML-DSA crate
        working-directory: libcrux-ml-dsa
        run: ./hax.sh prove --admit

  # XXX: Is the caching performed by hacspec/hax-actions enough to get CI minutes down for paid runners?
